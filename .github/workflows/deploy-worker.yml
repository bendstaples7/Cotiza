name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint (regression guards)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify deploy health gate (production-like config)
        run: npm run verify:deploy-health

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy worker to Cloudflare
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply catalog ordering to production
        run: node scripts/apply-catalog-order.mjs --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-client:
    runs-on: ubuntu-latest
    name: Deploy Client
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Client ships whenever the worker deploy succeeds, even if the post-deploy
      # health gate fails — avoids stranding production with a new worker + old UI.
      - name: Build client
        run: npm run build:client

      - name: Deploy client to Cloudflare Pages
        run: npx wrangler pages deploy client/dist --project-name=cotiza --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify-production:
    runs-on: ubuntu-latest
    name: Verify Production Health
    needs: [deploy-worker, deploy-client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify worker health
        run: node scripts/verify-worker-health.mjs

      - name: Smoke-test external pipelines
        env:
          HEALTHCHECK_KEY: ${{ secrets.HEALTHCHECK_KEY }}
        run: node scripts/verify-pipeline-smoke.mjs
