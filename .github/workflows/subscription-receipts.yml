name: Save Jobber subscription receipts to Google Drive
on:
  schedule:
    - cron: '0 15 24-28 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Receipt month YYYY-MM; blank means current Chicago month'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: jobber-subscription-receipts
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/unit/subscription-receipts.test.mjs tests/unit/subscription-drive.test.mjs
  download:
    needs: validate
    # No credentials or financial downloads on PRs/forks; explicit activation after live validation.
    if: github.repository == 'bendstaples7/Cotiza' && github.ref == 'refs/heads/main' && vars.JOBBER_RECEIPTS_DRIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh existing Jobber session
        working-directory: worker
        run: node scripts/sync-cookies.mjs --target remote
        env:
          JOBBER_WEB_EMAIL: ${{ secrets.JOBBER_WEB_EMAIL }}
          JOBBER_WEB_PASSWORD: ${{ secrets.JOBBER_WEB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Download original PDFs
        env:
          RECEIPT_MONTH: ${{ inputs.month }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$RECEIPT_MONTH" ]; then
            node scripts/jobber-subscription-receipts.mjs --month "$RECEIPT_MONTH"
          else
            node scripts/jobber-subscription-receipts.mjs
          fi
      - name: Save PDFs to Chicago Reno Drive
        run: node scripts/upload-subscription-receipts.mjs subscription-receipt-output
        env:
          JOBBER_DRIVE_CLIENT_ID: ${{ secrets.JOBBER_DRIVE_CLIENT_ID }}
          JOBBER_DRIVE_CLIENT_SECRET: ${{ secrets.JOBBER_DRIVE_CLIENT_SECRET }}
          JOBBER_DRIVE_REFRESH_TOKEN: ${{ secrets.JOBBER_DRIVE_REFRESH_TOKEN }}
          JOBBER_RECEIPTS_DRIVE_FOLDER_ID: ${{ vars.JOBBER_RECEIPTS_DRIVE_FOLDER_ID }}
      - name: Remove temporary financial files
        if: always()
        run: rm -rf -- subscription-receipt-output
